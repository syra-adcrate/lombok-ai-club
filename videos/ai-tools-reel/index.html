<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0c2527;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-coex" id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="30">
      <div data-hf-id="hf-ht2c" id="el-hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.5" data-track-index="1" data-width="1080" data-height="1920"></div>

      <div data-hf-id="hf-nwgb" id="el-tools" data-composition-id="tools" data-composition-src="compositions/tools.html" data-start="4.5" data-duration="19.5" data-track-index="1" data-width="1080" data-height="1920"></div>

      <div data-hf-id="hf-c8g8" id="el-cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="24" data-duration="6" data-track-index="1" data-width="1080" data-height="1920"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
