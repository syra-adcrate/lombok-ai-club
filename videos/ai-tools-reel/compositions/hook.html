      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });
          const F = 1 / 30;
          const DUR = 4.5;

          // Backdrop: glow blooms in, hairlines draw, ghost drifts across the whole scene.
          tl.fromTo(
            "#hk-glow",
            { opacity: 0, scale: 0.85 },
            { opacity: 0.3, scale: 1, duration: 1.0, ease: "power2.out" },
            0.1,
          );
          tl.fromTo(
            "#hk-line-a",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.7, ease: "power3.out" },
            0.2,
          );
          tl.fromTo(
            "#hk-line-b",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.7, ease: "power3.out" },
            0.35,
          );
          tl.fromTo("#hk-ghost", { x: 0 }, { x: -70, duration: DUR, ease: "none" }, 0);

          // Kicker sets the stage early.
          tl.fromTo(
            "#hk-kicker",
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
            0.15,
          );

          // Waterfall entry: binary reveal + whip from below, gaps shrinking.
          let t = 0.5;
          tl.set("#hk-l1", { opacity: 1, y: 76 }, t);
          tl.to("#hk-l1", { y: 0, duration: 0.18, ease: "power4.out" }, t);
          t = t + 0.18 + 2 * F;
          tl.set("#hk-l2", { opacity: 1, y: 50 }, t);
          tl.to("#hk-l2", { y: 0, duration: 0.15, ease: "power4.out" }, t);
          t = t + 0.15 - F;
          tl.set("#hk-l3", { opacity: 1, y: 44 }, t);
          tl.to("#hk-l3", { y: 0, duration: 0.14, ease: "power4.out" }, t);
          t = t + 0.14 - F;
          tl.set("#hk-l4", { opacity: 1, y: 42 }, t);
          tl.to("#hk-l4", { y: 0, duration: 0.13, ease: "power4.out" }, t);

          // LOMBOK slams on its own beat.
          tl.fromTo(
            "#hk-l5",
            { opacity: 0, scale: 1.5, filter: "blur(16px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
            1.65,
          );

          // Marker sweep under PAY after the slam settles.
          tl.to("#hk-mark", { scaleX: 1, duration: 0.45, ease: "power2.out" }, 2.3);

          // Hold: bounded glow breathe + hairline pulse, settling before the cut.
          const glow = null;
          const phase = { p: 0 };
          const IDLE_START = 2.4;
          const IDLE_DUR = DUR - IDLE_START;
          const CYCLES = 1;
          tl.to(
            phase,
            {
              p: Math.PI * 2 * CYCLES,
              duration: IDLE_DUR,
              ease: "none",
              onUpdate: function () {
                const el = document.getElementById("hk-glow");
                if (!el) return;
                const prog = phase.p / (Math.PI * 2 * CYCLES);
                const env = prog < 0.8 ? 1 : (1 - prog) / 0.2;
                const s = Math.sin(phase.p);
                el.style.opacity = String(0.3 + s * 0.04 * env);
              },
            },
            IDLE_START,
          );

          window.__timelines["hook"] = tl;
        })();
