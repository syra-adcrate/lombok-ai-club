      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });
          const F = 1 / 30;
          const DUR = 19.5;
          const PHASE = 6.5;

          // Shared backdrop: hairlines draw once, glow holds a slow bounded breathe.
          tl.fromTo("#t-line-a", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.1);
          tl.fromTo("#t-line-b", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.25);
          const phaseProxy = { p: 0 };
          const CYCLES = 5;
          tl.to(
            phaseProxy,
            {
              p: Math.PI * 2 * CYCLES,
              duration: DUR - 0.2,
              ease: "none",
              onUpdate: function () {
                const el = document.getElementById("t-glow");
                if (!el) return;
                const prog = phaseProxy.p / (Math.PI * 2 * CYCLES);
                const env = prog < 0.85 ? 1 : (1 - prog) / 0.15;
                const s = Math.sin(phaseProxy.p);
                el.style.opacity = String(0.28 + s * 0.035 * env);
              },
            },
            0.2,
          );

          // One phase = one build; entrances vary by axis, exit is a scale-swap out.
          function buildPhase(n, S, isLast) {
            const p = "#t-p" + n;
            tl.set(p, { opacity: 1 }, S);
            // Ghost drifts for the phase's whole window.
            tl.fromTo("#t-g" + n, { x: 0 }, { x: -60, duration: PHASE, ease: "none" }, S);
            // Kicker rises.
            tl.fromTo(
              "#t-k" + n,
              { opacity: 0, y: 22 },
              { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
              S + 0.15,
            );
            // Index: spring-pop from the left edge, smooth settle.
            tl.fromTo(
              "#t-i" + n,
              { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
              S + 0.1,
            );
            // Name: hard side-snap.
            tl.fromTo(
              "#t-n" + n,
              { opacity: 0, x: -320 },
              { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" },
              S + 0.45,
            );
            // Workflow line: whip from below, binary reveal.
            tl.set("#t-l" + n, { opacity: 1, y: 46 }, S + 0.95);
            tl.to("#t-l" + n, { y: 0, duration: 0.16, ease: "power4.out" }, S + 0.95);
            // Tag pill: playful pop (island-casual brand register).
            tl.fromTo(
              "#t-t" + n,
              { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" },
              S + 1.5,
            );
            // Exit: shrink-and-fade so the next phase pops into the vacuum.
            if (!isLast) {
              tl.to(
                p,
                { opacity: 0, scale: 0.88, duration: 0.35, ease: "power2.in" },
                S + PHASE - 0.35,
              );
            }
          }

          buildPhase(1, 0, false);
          buildPhase(2, PHASE, false);
          buildPhase(3, PHASE * 2, true);

          window.__timelines["tools"] = tl;
        })();
      </script>
